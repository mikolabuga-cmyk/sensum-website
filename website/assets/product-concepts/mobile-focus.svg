<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610"><title>Illustrative mobile planning app concept</title><defs><linearGradient id="field" x2=".8" y2="1"><stop stop-color="#e5edf4"/><stop offset="1" stop-color="#b3c6d7"/></linearGradient><linearGradient id="lavender" x2="1" y2="1"><stop stop-color="#ece9f1"/><stop offset="1" stop-color="#c9c7dd"/></linearGradient><linearGradient id="area" x2="0" y2="1"><stop stop-color="#9bb9d3" stop-opacity=".55"/><stop offset="1" stop-color="#9bb9d3" stop-opacity="0"/></linearGradient></defs><g font-family="Inter,Arial,sans-serif"><rect x="0" y="0" width="600" height="610" rx="0" fill="url(#lavender)" stroke="none"/><text x="32" y="43" fill="#655f7f" font-size="13" font-weight="500">MOBILE / CONCEPT</text><rect x="105" y="70" width="390" height="584" rx="30" fill="#b5b2c9" stroke="none"/><rect x="98" y="62" width="390" height="584" rx="30" fill="#fdfcfb" stroke="#d5d2df"/><text x="126" y="99" fill="#243746" font-size="14" font-weight="600">9:41</text><rect x="437" y="85" width="22" height="11" rx="3" fill="#344253" stroke="none"/><text x="126" y="151" fill="#243746" font-size="26" font-weight="600">Your day, with focus.</text><text x="126" y="181" fill="#7a7c87" font-size="16" font-weight="400">Make room for what matters.</text><rect x="126" y="206" width="334" height="46" rx="12" fill="#efedf4" stroke="none"/><rect x="130" y="210" width="106" height="38" rx="9" fill="#fff" stroke="none"/><text x="157" y="235" fill="#243746" font-size="16" font-weight="500">Today</text><text x="254" y="235" fill="#85818e" font-size="16" font-weight="400">Week</text><text x="360" y="235" fill="#85818e" font-size="16" font-weight="400">Month</text><rect x="126" y="276" width="334" height="148" rx="18" fill="#dfe8f1" stroke="none"/><text x="147" y="307" fill="#5d7689" font-size="14" font-weight="400">Your next step</text><text x="147" y="344" fill="#243746" font-size="27" font-weight="500">Shape the idea.</text><text x="147" y="373" fill="#5d7689" font-size="15" font-weight="400">One thoughtful step at a time.</text><circle cx="427" cy="393" r="17" fill="#405d78"/><path d="M420 393h14m-6-6 6 6-6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="126" y="462" fill="#243746" font-size="21" font-weight="500">Today’s focus</text><circle cx="141" cy="502" r="12" fill="#698975"/><path d="M135 502l4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="508" fill="#243746" font-size="17" font-weight="400">Map the opportunity</text><path d="M126 528H460" fill="none" stroke="#ecebf0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="141" cy="563" r="12" fill="#fdfcfb"/><circle cx="141" cy="563" r="10" fill="#e8e8ed"/><text x="165" y="569" fill="#243746" font-size="17" font-weight="400">Explore the first prototype</text><path d="M126 589H460" fill="none" stroke="#ecebf0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g></svg>